<style>
:root{--bg:#f3efe4;--card:#fbf9f3;--line:#ddd6c4;--line2:#e6dfcd;--ink:#1c211d;--soft:#4b5149;--muted:#5f665d;--faint:#8b8676;--acc:#b33a0b;--accbg:#f6e3d8;--teal:#1f6f78}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
#scaler{width:1280px;height:800px;transform-origin:top left}
#app{width:1280px;height:800px;padding:22px 40px 22px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace}
.serif{font-family:'Fraunces',Georgia,serif}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-weight:600;font-size:36px;line-height:1.05}
button{font-family:'IBM Plex Sans',sans-serif}
.ctl{height:44px;min-width:44px;border-radius:10px;border:1px solid #d6cfbd;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-size:14px;font-weight:500}
.ctl:hover{background:#ece6d6}
.tab{height:44px;padding:0 13px;border-radius:10px;border:1px solid #d6cfbd;background:var(--card);color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{border-color:#8b8676}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.step.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.step.done{color:var(--ink)}
.step{color:var(--muted)}
.card{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.legend{display:flex;gap:12px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:5px;display:inline-block}
svg#st{display:block;cursor:grab;touch-action:none}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--bg);font-size:12.5px}
.cand.on{background:var(--accbg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:20px 128px 116px 42px 100px minmax(0,1fr);gap:6px;align-items:center;padding:0 6px}
.row{height:27px;border-radius:6px}
.bars{position:relative;height:14px}
.tag{justify-self:start;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent}
</style>
</head>

<div id="scaler"><div id="app">

<h1 class="serif">Come si sceglie cosa allenare, e con chi</h1></div>

<button class="ctl" id="toggle"><svg id="icoPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg><svg id="icoPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4l13 8-13 8z"/></svg><span id="playLabel">Pausa</span></button>
</div>
</div>

<div style="display:flex;justify-content:space-between;gap:16px">
<div style="display:flex;gap:6px" id="tabs"></div>
<div style="display:flex;gap:6px" id="steps"></div>
</div>

<div style="height:22px;display:flex;align-items:center;gap:10px;font-size:14.5px">
<span style="width:8px;height:8px;border-radius:4px;background:var(--acc);flex-shrink:0"></span><span id="caption"></span>
</div>

<div style="display:flex;gap:18px;flex-grow:1;min-height:0">

<div class="card" style="width:560px;flex-shrink:0;display:flex;flex-direction:column">
<div style="height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--muted)">

<svg id="st" width="560" height="452" viewBox="0 0 560 452"></svg>
<div style="padding:2px 18px 12px;display:flex;flex-direction:column;gap:6px">
<div id="cands" style="display:flex;flex-direction:column;gap:5px"></div>
<div class="mono" id="formula" style="font-size:11.5px;color:var(--soft)"></div>
</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">

<span class="mono" style="font-size:12px;color:var(--muted)" id="tblSub"></span>
</div>
<div class="grid mono" style="font-size:11px;color:var(--muted)"><span>#</span><span>statistica</span><span style="text-align:center">peso</span><span></span><span>giocatore ● vs ruolo ◆</span><span>esito</span></div>
<div id="rows" style="display:flex;flex-direction:column;gap:2px"></div>
<div id="bottom" style="border-top:1px solid var(--line2);padding-top:9px;flex-grow:1;display:flex;flex-direction:column;gap:6px"></div>
</div>
</div>
</div></div>

  var R=project(c.rz,cam), PP=pts[c.n];
  // ombre per i punti in evidenza
  var focus=[c.n].concat(c.rm); if(mentorOn)focus.push(c.mi);
  focus.forEach(function(i){var F=project([Z[i][0],FLOOR,Z[i][2]],cam);h.push('<line x1="'+f1(pts[i].x)+'" y1="'+f1(pts[i].y)+'" x2="'+f1(F.x)+'" y2="'+f1(F.y)+'" stroke="#cfc8b6" stroke-dasharray="2 3"/><ellipse cx="'+f1(F.x)+'" cy="'+f1(F.y)+'" rx="'+f1(6*F.k)+'" ry="'+f1(2.2*F.k*Math.max(0.3,cam.sp))+'" fill="#d9d2c0"/>');});

  // proiezione sull'asse scelto: ritardo dello score rispetto alla media del ruolo
  var pr=ramp(lt,0.8,0.3), grow=ease(ramp(lt,0.9,1.3));
  var ePa=[0,0,0],eRa=[0,0,0];ePa[j]=pz[j];eRa[j]=c.rz[j];
  var Pa=project(ePa,cam),Ra=project(eRa,cam);
  var gx=lerp(Ra.x,Pa.x,grow),gy=lerp(Ra.y,Pa.y,grow);
  h.push('<g opacity="'+(pr*(step>=3?0.35:1)).toFixed(2)+'"><line x1="'+f1(PP.x)+'" y1="'+f1(PP.y)+'" x2="'+f1(Pa.x)+'" y2="'+f1(Pa.y)+'" stroke="'+ACC+'" stroke-width="1.2" stroke-dasharray="3 3"/>'
    +'<line x1="'+f1(R.x)+'" y1="'+f1(R.y)+'" x2="'+f1(Ra.x)+'" y2="'+f1(Ra.y)+'" stroke="'+TEAL+'" stroke-width="1.2" stroke-dasharray="3 3"/>'
    +'<line x1="'+f1(Ra.x)+'" y1="'+f1(Ra.y)+'" x2="'+f1(gx)+'" y2="'+f1(gy)+'" stroke="'+ACC+'" stroke-width="6" stroke-linecap="round" opacity="0.85"/>'
    +'<text x="'+f1((Ra.x+Pa.x)/2+10)+'" y="'+f1((Ra.y+Pa.y)/2-8)+'" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="'+ACC+'">z'+sub(j)+' − media = '+fmt(pz[j]-c.rz[j],2)+'</text></g>');

  // giocatori, dal più lontano al più vicino
  var order=Z.map(function(z,i){return i;}).sort(function(a,b){return pts[a].depth-pts[b].depth;});
  var labels=[];
  order.forEach(function(i){
    var isP=i===c.n,isR=c.rm.indexOf(i)>=0,isM=mentorOn&&i===c.mi;
    var fill=isP?ACC:(isR||isM?TEAL:'#b9b3a3'), r=(isP?8:(isR||isM?6:4.5))*pts[i].k;
    h.push('<circle cx="'+f1(pts[i].x)+'" cy="'+f1(pts[i].y)+'" r="'+f1(r)+'" fill="'+fill+'" opacity="'+(isP||isR||isM?1:0.5)+'" stroke="#fbf9f3" stroke-width="1.5"/>');
    if(isP||isR||isM)labels.push('<text x="'+f1(pts[i].x+10)+'" y="'+f1(pts[i].y+4)+'" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="'+(isP?600:400)+'" fill="'+(isP?ACC:TEAL)+'">'+AB[i]+'</text>');
  });
  h.push('<polygon points="'+f1(R.x)+','+f1(R.y-8)+' '+f1(R.x+8)+','+f1(R.y)+' '+f1(R.x)+','+f1(R.y+8)+' '+f1(R.x-8)+','+f1(R.y)+'" fill="'+TEAL+'" stroke="#fbf9f3" stroke-width="1.5"/>');
  h.push(labels.join(''));

  // effetto del miglioramento: z + Bᵀ Δx
  if(effOn){
    var ge=ease(ramp(lt,STEP_T[3]+0.3,1.4));
    var tgt=[pz[0]+c.dz[0]*ge,pz[1]+c.dz[1]*ge,pz[2]+c.dz[2]*ge], T=project(tgt,cam);
    var dx=T.x-PP.x,dy=T.y-PP.y,len=Math.hypot(dx,dy);
    var op=step===4?0.45:1;
    h.push('<g opacity="'+op+'"><circle cx="'+f1(T.x)+'" cy="'+f1(T.y)+'" r="9" fill="none" stroke="'+ACC+'" stroke-width="2" stroke-dasharray="3 3"/>');
    if(len>14){var ux=dx/len,uy=dy/len;h.push('<line x1="'+f1(PP.x+ux*10)+'" y1="'+f1(PP.y+uy*10)+'" x2="'+f1(T.x-ux*12)+'" y2="'+f1(T.y-uy*12)+'" stroke="'+ACC+'" stroke-width="2.5" stroke-linecap="round"/>'+arrowHead(T.x-ux*12,T.y-uy*12,ux,uy,ACC));}
    h.push('<text x="'+f1(T.x-14)+'" y="'+f1(T.y+4)+'" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="'+ACC+'">dopo l’allenamento</text></g>');
  }
  // mentore
  if(mentorOn){
    var Mp=pts[c.mi], g2=ease(ramp(lt,STEP_T[4]+0.3,0.8));
    var mdx=PP.x-Mp.x,mdy=PP.y-Mp.y,ml2=Math.hypot(mdx,mdy)||1,mx=mdx/ml2,my=mdy/ml2;
    var sx=Mp.x+mx*16,sy=Mp.y+my*16,ex=lerp(sx,PP.x-mx*14,g2),ey=lerp(sy,PP.y-my*14,g2);
    h.push('<circle cx="'+f1(Mp.x)+'" cy="'+f1(Mp.y)+'" r="13" fill="none" stroke="'+TEAL+'" stroke-width="2.5"/>'
      +'<line x1="'+f1(sx)+'" y1="'+f1(sy)+'" x2="'+f1(ex)+'" y2="'+f1(ey)+'" stroke="'+TEAL+'" stroke-width="2.5" stroke-linecap="round"/>'+arrowHead(ex,ey,mx,my,TEAL)
      +'<text x="'+f1(Mp.x)+'" y="'+f1(Mp.y<60?Mp.y+30:Mp.y-20)+'" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="'+TEAL+'">mentore: '+c.mv.filter(function(m){return true;}).reduce(function(a,m){return m[1]>a[1]?m:a;})[0]+'</text>');
  }
  h.push('<text x="548" y="444" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#8b8676">trascina per ruotare</text>');
  setHTML(svg,h.join(''));

  // ---- assi candidati e formula
  var ch='';
  c.cand.forEach(function(k,a){
    var use=k[0]?'il ruolo sta sul lato '+(k[1]>0?'+':'−'):'il ruolo non è caratterizzato da questo asse';
    ch+='<div class="cand'+(a===j&&hl?' on':'')+'"><span class="mono" style="font-weight:500">b'+sub(a)+'</span><span style="flex-grow:1;color:var(--soft)">'+use+'</span><span class="mono">deficit '+(k[0]?fmt(k[2],2):'—')+'</span></div>';
  });
  setHTML($('cands'),ch);
  $('formula').style.opacity=ramp(lt,1.8,0.5);
  $('formula').textContent='deficit = s·(z'+sub(j)+' − media)/√λ'+sub(j)+' = '+(c.s>0?'+1':'−1')+'·('+fmt(pz[j]-c.rz[j],2)+')/√'+LAM[j].toFixed(3).replace('.',',')+' = '+fmt(c.d,2);

  // ---- tabella dei pesi
  $('tblTitle').textContent='Pesi di b'+sub(j)+' nel verso '+((c.role==='piloni'||c.role==='centri')?'dei ':'delle ')+c.role;
  $('tblSub').textContent='s·B[k, '+(j+1)+'] con s = '+(c.s>0?'+1':'−1');
  var barG=ease(ramp(lt,3.2,1.2)), top6=lt>=4.6;
  var TAGS={ok:['scelta',ACC,'#fff',ACC],extra:['valida, oltre le 3','#fbf9f3','#4b5149','#b9b3a3'],ruolo:['il ruolo non la usa','#ece6d6','#4b5149','#ece6d6'],sopra:['già ≥ media ruolo','#ece6d6','#4b5149','#ece6d6'],out:['fuori dai primi 6','#fbf9f3','#8b8676','#fbf9f3']};
  function DP(v){return clamp((v+1.6)/4.8*100,0,100);}
  var rh='';
  c.rows.forEach(function(r,i){
    var w=r[1],len=Math.abs(w)/0.5*54*barG,st=r[4],tg=TAGS[st];
    var tagAt=st==='out'?6.2:6.3+i*0.45;
    var tOp=step>=2?ramp(lt,tagAt,0.3):0, dOp=step>=2&&i<6?tOp:0;
    var px=DP(r[2]),rx=DP(r[3]),below=r[2]<r[3],dim=step>=3&&st!=='ok';
    var bc=w>=0?(i<6&&top6?ACC:'#d9a58a'):'#c9c1ad';
    rh+='<div class="grid row" style="background:'+(i<6&&top6?'#f1e8dc':'transparent')+';opacity:'+(dim?0.35:1)+'">'
      +'<span class="mono" style="font-size:11px;color:var(--muted)">'+(step>=1?i+1:'')+'</span>'
      +'<span style="font-size:13px;font-weight:'+(st==='ok'&&step>=2?600:400)+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nice(r[0])+'</span>'
      +'<div class="bars"><div style="position:absolute;left:58px;top:-4px;width:1px;height:22px;background:#c9c1ad"></div><div style="position:absolute;top:2px;left:'+f1(w>=0?58:58-len)+'px;width:'+f1(len)+'px;height:10px;border-radius:2px;background:'+bc+'"></div></div>'
      +'<span class="mono" style="font-size:11.5px;text-align:right">'+(step>=1?fmt(w,2):'')+'</span>'
      +'<div class="bars" style="opacity:'+dOp.toFixed(2)+'"><div style="position:absolute;left:0;top:6px;width:100px;height:1px;background:#ddd6c4"></div><div style="position:absolute;top:5px;left:'+f1(Math.min(px,rx))+'px;width:'+f1(Math.abs(px-rx))+'px;height:3px;background:'+(below?ACC:'#b9b3a3')+'"></div><div style="position:absolute;top:2px;left:'+f1(rx-4)+'px;width:8px;height:8px;transform:rotate(45deg);background:'+TEAL+'"></div><div style="position:absolute;top:1px;left:'+f1(px-5)+'px;width:10px;height:10px;border-radius:5px;background:'+(below?ACC:'#1c211d')+'"></div></div>'
      +'<span class="tag" style="background:'+tg[1]+';color:'+tg[2]+';border-color:'+tg[3]+';opacity:'+tOp.toFixed(2)+'">'+tg[0]+'</span></div>';
  });
  setHTML($('rows'),rh);

  // ---- riquadro in basso: nota, effetto o mentore
  var bh='';
  if(step<3){
    var nOp=step>=2?ramp(lt,8.6,0.5):0;
    bh='<div style="font-size:12.5px;line-height:1.45;color:var(--soft);opacity:'+nOp.toFixed(2)+'">'+NOTES[ci]+'</div>'
      +'<div style="font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:auto">Valori standardizzati: 1 = una deviazione standard della squadra. Il peso è la leva, il ritardo è il margine: contano tutti e due.</div>';
  }else if(step===3){
    var ge2=ease(ramp(lt,STEP_T[3]+0.3,1.4)),tot=0;
    bh='<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="serif" style="font-size:17px;font-weight:600">Effetto: peso × recupero</span><span class="mono" style="font-size:11.5px;color:var(--muted)">Δz'+sub(j)+' = Σ s·B[k,'+(j+1)+']·Δx_k</span></div>'
      +'<div class="mono" style="display:grid;grid-template-columns:170px 60px 80px 80px;gap:6px;font-size:11px;color:var(--muted)"><span>statistica</span><span>peso</span><span>recupero Δx</span><span>contributo</span></div>';
    c.contrib.forEach(function(r){tot+=r[3];bh+='<div style="display:grid;grid-template-columns:170px 60px 80px 80px;gap:6px;font-size:12.5px"><span>'+nice(r[0])+'</span><span class="mono">'+fmt(r[1],2)+'</span><span class="mono">'+fmt(r[2],2)+'</span><span class="mono" style="color:'+ACC+';font-weight:600">'+fmt(r[3],3)+'</span></div>';});
    var pct=Math.round(tot/c.gap*100);
    bh+='<div style="height:12px;border-radius:6px;background:#ece6d6;position:relative;margin-top:4px"><div style="height:12px;border-radius:6px;width:'+f1(clamp(tot/c.gap,0,1)*100*ge2)+'%;background:'+ACC+'"></div></div>'
      +'<div style="font-size:12.5px;line-height:1.45">Recupera <b>'+fmt(tot,2).replace('+','')+'</b> su un ritardo di <b>'+c.gap.toFixed(2).replace('.',',')+'</b> lungo b'+sub(j)+': <b style="color:'+ACC+'">'+pct+'%</b>. Nello spazio 3D si muove anche sugli altri assi: Δz = ('+c.dz.map(function(v){return fmt(v,2);}).join(', ')+').</div>';
  }else{
    var mG=ease(ramp(lt,STEP_T[4]+0.2,1)),best=0;c.mv.forEach(function(m,i){if(m[1]>c.mv[best][1])best=i;});
    var sel=c.contrib.map(function(r){return nice(r[0]);}).join(', ');
    bh='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="serif" style="font-size:17px;font-weight:600">Mentore nel gruppo '+(c.g+1)+'</span><span style="font-size:11.5px;color:var(--muted)">media su: '+sel+'</span></div>';
    c.mv.forEach(function(m,i){var len=Math.abs(m[1])/1.3*100*mG,win=i===best;
      bh+='<div style="display:grid;grid-template-columns:130px 220px 50px minmax(0,1fr);gap:8px;align-items:center;height:22px"><span style="font-size:12.5px;font-weight:'+(win?600:400)+'">'+m[0]+'</span><div class="bars" style="height:12px"><div style="position:absolute;left:110px;top:-3px;width:1px;height:18px;background:#c9c1ad"></div><div style="position:absolute;top:1px;left:'+f1(m[1]>=0?110:110-len)+'px;width:'+f1(len)+'px;height:10px;border-radius:2px;background:'+(win?TEAL:'#c9c1ad')+'"></div></div><span class="mono" style="font-size:11.5px;text-align:right">'+fmt(m[1],2)+'</span><span style="font-size:11.5px;color:'+TEAL+';font-weight:600">'+(win&&mG>0.9?'mentore':'')+'</span></div>';});
  }
  setHTML($('bottom'),bh);
}

// ------------------------------------------------------------ ciclo (window.__seek per registrare fotogramma per fotogramma)
var last=performance.now();
function loop(now){var dt=Math.min(0.1,(now-last)/1000);last=now;if(state.playing&&!window.__manual){state.time+=dt*speed;if(state.time>=END)state.time=0;}render(state.time);requestAnimationFrame(loop);}
window.__seek=function(t){window.__manual=true;state.time=t;render(t);};
requestAnimationFrame(loop);
</script>
</body>
</html>
