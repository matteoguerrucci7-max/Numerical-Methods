<style>
:root{--bg:#0e1712;--card:#142019;--line:#24342b;--line2:#24342b;--ink:#eef2ea;--soft:#c3cec6;--muted:#9fb0a4;--faint:#7f9387;--acc:#f5d565;--accbg:#262d1c;--teal:#6cc4c0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
#scaler{width:1280px;height:800px;transform-origin:top left}
#app{width:1280px;height:800px;padding:22px 40px 22px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace}
.serif{font-family:'Barlow Condensed',sans-serif;letter-spacing:.01em}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-weight:700;font-size:42px;line-height:1}
button{font-family:'IBM Plex Sans',sans-serif}
.ctl{height:44px;min-width:44px;border-radius:10px;border:1px solid #2c3f33;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-size:14px;font-weight:500}
.ctl:hover{background:#1f2e25}
.tab{height:44px;padding:0 13px;border-radius:10px;border:1px solid #2c3f33;background:var(--card);color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{border-color:#7f9387}
.tab.on{background:#1f2e25;color:var(--ink);border-color:var(--acc)}
.step.on{background:#1f2e25;color:var(--ink);border-color:var(--acc)}
.step.done{color:var(--ink)}
.step{color:var(--muted)}
.card{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.legend{display:flex;gap:12px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:5px;display:inline-block}
svg#st{display:block;cursor:grab;touch-action:none}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--bg);font-size:12.5px}
.cand.on{background:var(--accbg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:20px 128px 116px 42px 100px minmax(0,1fr);gap:6px;align-items:center;padding:0 6px}
.row{height:27px;border-radius:6px}
.bars{position:relative;height:14px}
.tag{justify-self:start;font-size:11.5px;font-weight:500;white-space:nowrap}
</style>
</head>
<body>
<div id="scaler"><div id="app">

<div><div class="kicker mono">PCA rugby · work directions in the 3D style space</div>
<h1 class="serif">How to choose what to train, and with whom</h1></div>

</div>
</div>

<div style="display:flex;justify-content:space-between;gap:16px">

</div>

<div style="height:22px;display:flex;align-items:center;gap:10px;font-size:14.5px">
<span id="caption" style="color:var(--soft)"></span>

<div class="mono" id="formula" style="font-size:11.5px;color:var(--soft)"></div>
</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">

<span class="mono" style="font-size:12px;color:var(--muted)" id="tblSub"></span>
</div>
<div class="grid mono" style="font-size:11px;color:var(--muted)"><span>#</span><span>statistic</span><span style="text-align:center">weight</span><span></span><span>player ● vs role ◆</span><span>outcome</span></div>

<div id="bottom" style="border-top:1px solid var(--line2);padding-top:9px;flex-grow:1;display:flex;flex-direction:column;gap:6px"></div>
</div>
</div>
</div></div>

function ease(x){x=clamp(x,0,1);return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}

  var x1=z[0]*cam.cy-z[2]*cam.sy, d=z[0]*cam.sy+z[2]*cam.cy;

  var ePa=[0,0,0],eRa=[0,0,0];ePa[j]=pz[j];eRa[j]=c.rz[j];
  var Pa=project(ePa,cam),Ra=project(eRa,cam);
  var gx=lerp(Ra.x,Pa.x,grow),gy=lerp(Ra.y,Pa.y,grow);
  h.push('<g opacity="'+(pr*(step>=3?0.35:1)).toFixed(2)+'"><line x1="'+f1(PP.x)+'" y1="'+f1(PP.y)+'" x2="'+f1(Pa.x)+'" y2="'+f1(Pa.y)+'" stroke="'+ACC+'" stroke-width="1.2" stroke-dasharray="3 3"/>'
    +'<line x1="'+f1(R.x)+'" y1="'+f1(R.y)+'" x2="'+f1(Ra.x)+'" y2="'+f1(Ra.y)+'" stroke="'+TEAL+'" stroke-width="1.2" stroke-dasharray="3 3"/>'
    +'<line x1="'+f1(Ra.x)+'" y1="'+f1(Ra.y)+'" x2="'+f1(gx)+'" y2="'+f1(gy)+'" stroke="'+ACC+'" stroke-width="6" stroke-linecap="round" opacity="0.85"/>'
    +'<text x="'+f1((Ra.x+Pa.x)/2+10)+'" y="'+f1((Ra.y+Pa.y)/2-8)+'" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="'+ACC+'">z'+sub(j)+' − mean = '+fmt(pz[j]-c.rz[j],2)+'</text></g>');

  // giocatori, dal più lontano al più vicino
  var order=Z.map(function(z,i){return i;}).sort(function(a,b){return pts[a].depth-pts[b].depth;});
  var labels=[];
  order.forEach(function(i){
    var isP=i===c.n,isR=c.rm.indexOf(i)>=0,isM=mentorOn&&i===c.mi;
    var fill=isP?ACC:(isR||isM?TEAL:'#5d7064'), r=(isP?8:(isR||isM?6:4.5))*pts[i].k;
    h.push('<circle cx="'+f1(pts[i].x)+'" cy="'+f1(pts[i].y)+'" r="'+f1(r)+'" fill="'+fill+'" opacity="'+(isP||isR||isM?1:0.5)+'" stroke="#142019" stroke-width="1.5"/>');
    if(isP||isR||isM)labels.push('<text x="'+f1(pts[i].x+10)+'" y="'+f1(pts[i].y+4)+'" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="'+(isP?600:400)+'" fill="'+(isP?ACC:TEAL)+'">'+AB[i]+'</text>');
  });
  h.push('<polygon points="'+f1(R.x)+','+f1(R.y-8)+' '+f1(R.x+8)+','+f1(R.y)+' '+f1(R.x)+','+f1(R.y+8)+' '+f1(R.x-8)+','+f1(R.y)+'" fill="'+TEAL+'" stroke="#142019" stroke-width="1.5"/>');
  h.push(labels.join(''));

  // effetto del miglioramento: z + Bᵀ Δx
  if(effOn){
    var ge=ease(ramp(lt,STEP_T[3]+0.3,1.4));
    var tgt=[pz[0]+c.dz[0]*ge,pz[1]+c.dz[1]*ge,pz[2]+c.dz[2]*ge], T=project(tgt,cam);
    var dx=T.x-PP.x,dy=T.y-PP.y,len=Math.hypot(dx,dy);
    var op=step===4?0.45:1;
    h.push('<g opacity="'+op+'"><circle cx="'+f1(T.x)+'" cy="'+f1(T.y)+'" r="9" fill="none" stroke="'+ACC+'" stroke-width="2" stroke-dasharray="3 3"/>');
    if(len>14){var ux=dx/len,uy=dy/len;h.push('<line x1="'+f1(PP.x+ux*10)+'" y1="'+f1(PP.y+uy*10)+'" x2="'+f1(T.x-ux*12)+'" y2="'+f1(T.y-uy*12)+'" stroke="'+ACC+'" stroke-width="2.5" stroke-linecap="round"/>'+arrowHead(T.x-ux*12,T.y-uy*12,ux,uy,ACC));}
    h.push('<text x="'+f1(T.x-14)+'" y="'+f1(T.y+4)+'" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="'+ACC+'">after training</text></g>');
  }
  // mentore
  if(mentorOn){
    var Mp=pts[c.mi], g2=ease(ramp(lt,STEP_T[4]+0.3,0.8));
    var mdx=PP.x-Mp.x,mdy=PP.y-Mp.y,ml2=Math.hypot(mdx,mdy)||1,mx=mdx/ml2,my=mdy/ml2;
    var sx=Mp.x+mx*16,sy=Mp.y+my*16,ex=lerp(sx,PP.x-mx*14,g2),ey=lerp(sy,PP.y-my*14,g2);
    h.push('<circle cx="'+f1(Mp.x)+'" cy="'+f1(Mp.y)+'" r="13" fill="none" stroke="'+TEAL+'" stroke-width="2.5"/>'
      +'<line x1="'+f1(sx)+'" y1="'+f1(sy)+'" x2="'+f1(ex)+'" y2="'+f1(ey)+'" stroke="'+TEAL+'" stroke-width="2.5" stroke-linecap="round"/>'+arrowHead(ex,ey,mx,my,TEAL)
      +'<text x="'+f1(Mp.x)+'" y="'+f1(Mp.y<60?Mp.y+30:Mp.y-20)+'" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="'+TEAL+'">mentor: '+c.mv.filter(function(m){return true;}).reduce(function(a,m){return m[1]>a[1]?m:a;})[0]+'</text>');
  }
  h.push('<text x="548" y="444" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#7f9387">drag to rotate</text>');
  setHTML(svg,h.join(''));

  // ---- assi candidati e formula
  var ch='';
  c.cand.forEach(function(k,a){
    var use=k[0]?'the role sits on the '+(k[1]>0?'+':'−')+' side':'the role is not characterised by this axis';
    ch+='<div class="cand'+(a===j&&hl?' on':'')+'"><span class="mono" style="font-weight:500">b'+sub(a)+'</span><span style="flex-grow:1;color:var(--soft)">'+use+'</span><span class="mono">deficit '+(k[0]?fmt(k[2],2):'—')+'</span></div>';
  });
  setHTML($('cands'),ch);
  $('formula').style.opacity=ramp(lt,1.8,0.5);
  $('formula').textContent='deficit = s·(z'+sub(j)+' − mean)/√λ'+sub(j)+' = '+(c.s>0?'+1':'−1')+'·('+fmt(pz[j]-c.rz[j],2)+')/√'+LAM[j].toFixed(3)+' = '+fmt(c.d,2);

  // ---- tabella dei pesi
  $('tblTitle').textContent='b'+sub(j)+' weights in the '+c.role+'\u2019 direction';
  $('tblSub').textContent='s·B[k, '+(j+1)+'] with s = '+(c.s>0?'+1':'−1');
  var barG=ease(ramp(lt,3.2,1.2)), top6=lt>=4.6;
  var TAGS={ok:['chosen','transparent',ACC,'transparent'],extra:['valid, beyond top 3','transparent','#c3cec6','transparent'],ruolo:['not used by the role','transparent','#9fb0a4','transparent'],sopra:['already ≥ role mean','transparent','#9fb0a4','transparent'],out:['outside top 6','transparent','#6f8577','transparent']};
  function DP(v){return clamp((v+1.6)/4.8*100,0,100);}
  var rh='';
  c.rows.forEach(function(r,i){
    var w=r[1],len=Math.abs(w)/0.5*54*barG,st=r[4],tg=TAGS[st];
    var tagAt=st==='out'?6.2:6.3+i*0.45;
    var tOp=step>=2?ramp(lt,tagAt,0.3):0, dOp=step>=2&&i<6?tOp:0;
    var px=DP(r[2]),rx=DP(r[3]),below=r[2]<r[3],dim=step>=3&&st!=='ok';
    var bc=w>=0?(i<6&&top6?ACC:'#8c7c3e'):'#3f5448';
    rh+='<div class="grid row" style="background:'+(i<6&&top6?'#1b2a21':'transparent')+';opacity:'+(dim?0.35:1)+'">'
      +'<span class="mono" style="font-size:11px;color:var(--muted)">'+(step>=1?i+1:'')+'</span>'
      +'<span style="font-size:13px;font-weight:'+(st==='ok'&&step>=2?600:400)+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nice(r[0])+'</span>'
      +'<div class="bars"><div style="position:absolute;left:58px;top:-4px;width:1px;height:22px;background:#3f5448"></div><div style="position:absolute;top:2px;left:'+f1(w>=0?58:58-len)+'px;width:'+f1(len)+'px;height:10px;border-radius:2px;background:'+bc+'"></div></div>'
      +'<span class="mono" style="font-size:11.5px;text-align:right">'+(step>=1?fmt(w,2):'')+'</span>'
      +'<div class="bars" style="opacity:'+dOp.toFixed(2)+'"><div style="position:absolute;left:0;top:6px;width:100px;height:1px;background:#24342b"></div><div style="position:absolute;top:5px;left:'+f1(Math.min(px,rx))+'px;width:'+f1(Math.abs(px-rx))+'px;height:3px;background:'+(below?ACC:'#5d7064')+'"></div><div style="position:absolute;top:2px;left:'+f1(rx-4)+'px;width:8px;height:8px;transform:rotate(45deg);background:'+TEAL+'"></div><div style="position:absolute;top:1px;left:'+f1(px-5)+'px;width:10px;height:10px;border-radius:5px;background:'+(below?ACC:'#eef2ea')+'"></div></div>'
      +'<span class="tag" style="background:'+tg[1]+';color:'+tg[2]+';border-color:'+tg[3]+';opacity:'+tOp.toFixed(2)+'">'+tg[0]+'</span></div>';
  });
  setHTML($('rows'),rh);

  // ---- riquadro in basso: nota, effetto o mentore
  var bh='';
  if(step<3){
    var nOp=step>=2?ramp(lt,8.6,0.5):0;
    bh='<div style="font-size:12.5px;line-height:1.45;color:var(--soft);opacity:'+nOp.toFixed(2)+'">'+NOTES[ci]+'</div>'
      +'<div style="font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:auto">Standardised values: 1 = one standard deviation of the squad. The weight is the lever, the gap is the room for improvement: both matter.</div>';
  }else if(step===3){
    var ge2=ease(ramp(lt,STEP_T[3]+0.3,1.4)),tot=0;
    bh='<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="serif" style="font-size:20px;font-weight:600">Effect: weight × recovery</span><span class="mono" style="font-size:11.5px;color:var(--muted)">Δz'+sub(j)+' = Σ s·B[k,'+(j+1)+']·Δx_k</span></div>'
      +'<div class="mono" style="display:grid;grid-template-columns:170px 60px 80px 80px;gap:6px;font-size:11px;color:var(--muted)"><span>statistic</span><span>weight</span><span>recovery Δx</span><span>contribution</span></div>';
    c.contrib.forEach(function(r){tot+=r[3];bh+='<div style="display:grid;grid-template-columns:170px 60px 80px 80px;gap:6px;font-size:12.5px"><span>'+nice(r[0])+'</span><span class="mono">'+fmt(r[1],2)+'</span><span class="mono">'+fmt(r[2],2)+'</span><span class="mono" style="color:'+ACC+';font-weight:600">'+fmt(r[3],3)+'</span></div>';});
    var pct=Math.round(tot/c.gap*100);
    bh+='<div style="height:12px;border-radius:6px;background:#1f2e25;position:relative;margin-top:4px"><div style="height:12px;border-radius:6px;width:'+f1(clamp(tot/c.gap,0,1)*100*ge2)+'%;background:'+ACC+'"></div></div>'
      +'<div style="font-size:12.5px;line-height:1.45">Recovers <b>'+fmt(tot,2).replace('+','')+'</b> of a gap of <b>'+c.gap.toFixed(2)+'</b> along b'+sub(j)+': <b style="color:'+ACC+'">'+pct+'%</b>. In 3D space the player also moves along the other axes: Δz = ('+c.dz.map(function(v){return fmt(v,2);}).join(', ')+').</div>';
  }else{
    var mG=ease(ramp(lt,STEP_T[4]+0.2,1)),best=0;c.mv.forEach(function(m,i){if(m[1]>c.mv[best][1])best=i;});
    var sel=c.contrib.map(function(r){return nice(r[0]);}).join(', ');
    bh='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span class="serif" style="font-size:20px;font-weight:600">Mentor in group '+(c.g+1)+'</span><span style="font-size:11.5px;color:var(--muted)">mean over: '+sel+'</span></div>';
    c.mv.forEach(function(m,i){var len=Math.abs(m[1])/1.3*100*mG,win=i===best;
      bh+='<div style="display:grid;grid-template-columns:130px 220px 50px minmax(0,1fr);gap:8px;align-items:center;height:22px"><span style="font-size:12.5px;font-weight:'+(win?600:400)+'">'+m[0]+'</span><div class="bars" style="height:12px"><div style="position:absolute;left:110px;top:-3px;width:1px;height:18px;background:#3f5448"></div><div style="position:absolute;top:1px;left:'+f1(m[1]>=0?110:110-len)+'px;width:'+f1(len)+'px;height:10px;border-radius:2px;background:'+(win?TEAL:'#3f5448')+'"></div></div><span class="mono" style="font-size:11.5px;text-align:right">'+fmt(m[1],2)+'</span><span style="font-size:11.5px;color:'+TEAL+';font-weight:600">'+(win&&mG>0.9?'mentor':'')+'</span></div>';});
  }
  setHTML($('bottom'),bh);
}

// ------------------------------------------------------------ ciclo (window.__seek per registrare fotogramma per fotogramma)
var last=performance.now();
function loop(now){var dt=Math.min(0.1,(now-last)/1000);last=now;if(state.playing&&!window.__manual){state.time+=dt*speed;if(state.time>=END)state.time=0;}render(state.time);requestAnimationFrame(loop);}
window.__seek=function(t){window.__manual=true;state.time=t;render(t);};
requestAnimationFrame(loop);
</script>
</body>
</html>
